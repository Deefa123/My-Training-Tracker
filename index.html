  return 'Your average rate of gain is above the bulk target for your current weight bracket. The suggested reduction is proportional to the excess rate to limit unnecessary fat gain.';
}

  if(analysis.status==='good')return 'Keep calories unchanged and continue collecting data. Reassess as the rolling 3-week trend updates.';
  return 'Apply the suggested calorie change consistently, then reassess after another 3 weeks of weekly-average data.';
}

function phaseCoachAnalysis(){
  let phase=currentPhase(),trend=latestThreeWeekTrend(),weeks=weeklyWeightAverages();
  let current=weeks.length?weeks[weeks.length-1].average:(latestBodyweight()?.kg||null);
  if(!current)return{status:'warn',title:'Add bodyweight data',message:'Log your bodyweight regularly so the coach can assess your trend.',target:'—',rate:null};
  let target=phaseTargetForWeight(phase,current);

  if(phase==='maintain'){
    let ref=maintainReference()||current;
    if(!trend)return{status:'warn',title:'Building a maintenance baseline',message:`Maintenance reference: ${ref.toFixed(1)} kg. I need 4 weekly averages to assess a 3-week trend.`,target:target.label,rate:null};
    let diffPct=((trend.currentAverage-ref)/ref)*100;
    if(diffPct>0.5){
      let kcal=kcalAdjustmentFromDeviation(current,diffPct-0.5);
      return{status:'bad',title:'Weight is drifting up',message:`Current weekly average is ${diffPct.toFixed(2)}% above your maintenance reference. Reduce intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:trend.averageRate};
    }
    if(diffPct<-0.5){
      let kcal=kcalAdjustmentFromDeviation(current,Math.abs(diffPct)-0.5);
      return{status:'bad',title:'Weight is drifting down',message:`Current weekly average is ${Math.abs(diffPct).toFixed(2)}% below your maintenance reference. Increase intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:trend.averageRate};
    }
    return{status:'good',title:'Maintenance is on target',message:`Your weekly average remains within ±0.5% of the ${ref.toFixed(1)} kg maintenance reference. Keep calories unchanged.`,target:target.label,rate:trend.averageRate};
  }

  if(!trend)return{status:'warn',title:'Building a 3-week trend',message:'I need 4 weekly averages to calculate three week-on-week changes. Keep logging your weight.',target:target.label,rate:null};
  let r=trend.averageRate;

  if(phase==='cut'){
    if(r>-0.50){
      let kcal=kcalAdjustmentFromDeviation(current,r+0.50);
      return{status:'bad',title:'Cut is too slow',message:`Your 3-week rate is ${r.toFixed(2)}%/week, slower than target. Reduce intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:r};
    }
    if(r<-0.75){
      let kcal=kcalAdjustmentFromDeviation(current,-0.75-r);
      return{status:'bad',title:'Cut is too fast',message:`Your 3-week rate is ${r.toFixed(2)}%/week, faster than target. Increase intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:r};
    }
    return{status:'good',title:'Cut is on target',message:`Your 3-week rate is ${r.toFixed(2)}%/week, inside the target band. Keep calories unchanged.`,target:target.label,rate:r};
  }

  if(r<target.min){
    let kcal=kcalAdjustmentFromDeviation(current,target.min-r);
    return{status:'bad',title:'Bulk is too slow',message:`Your 3-week rate is ${r.toFixed(2)}%/week, below target. Increase intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:r};
  }
  if(r>target.max){
    let kcal=kcalAdjustmentFromDeviation(current,r-target.max);
    return{status:'bad',title:'Bulk is too fast',message:`Your 3-week rate is ${r.toFixed(2)}%/week, above target. Reduce intake by about ${kcal} kcal/day and reassess after 3 weeks.`,target:target.label,rate:r};
  }
  return{status:'good',title:'Bulk is on target',message:`Your 3-week rate is ${r.toFixed(2)}%/week, inside the target band. Keep calories unchanged.`,target:target.label,rate:r};
}
function phaseControlCard(){

function drawBodyweightTrend(){
  let c=document.getElementById('bodyweight-trend-chart');if(!c)return;
  let daily=visibleDailyWeights(),weeks=visibleWeeklyWeights();if(!daily.length&&!weeks.length)return;
  let target=trendTargetSeries(weeks),dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
  let W=Math.max(320,rect.width||800),H=320;c.width=W*dpr;c.height=H*dpr;
  let ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.font='12px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif';

  let allDates=[...daily.map(x=>x.date),...weeks.map(x=>x.week)];
  let t0=Math.min(...allDates.map(x=>new Date(x+'T12:00:00').getTime()));
  let t1=Math.max(...allDates.map(x=>new Date(x+'T12:00:00').getTime()));
  if(t1===t0)t1=t0+86400000;

  let vals=[...daily.map(x=>+x.kg),...weeks.map(x=>+x.average),...target.flatMap(x=>[x.low,x.high])].filter(Number.isFinite);
  let min=Math.min(...vals),max=Math.max(...vals),spread=Math.max(.5,max-min),extra=spread*.12;min-=extra;max+=extra;

  let pad={l:52,r:18,t:24,b:44},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  let xFor=d=>pad.l+((new Date(d+'T12:00:00').getTime()-t0)/(t1-t0))*pw;
  let yFor=v=>pad.t+(max-v)/(max-min)*ph;
  let css=getComputedStyle(document.body),line=css.getPropertyValue('--line').trim(),accent=css.getPropertyValue('--accent').trim(),muted=css.getPropertyValue('--muted').trim();

  // Grid and y-axis labels
  ctx.strokeStyle=line;ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    let y=pad.t+ph*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    let v=max-(max-min)*i/4;ctx.fillStyle=muted;ctx.fillText(v.toFixed(1)+' kg',4,y+4);
  }

  // Target corridor
  if(target.length){
    ctx.save();ctx.globalAlpha=.16;ctx.fillStyle=accent;ctx.beginPath();
    target.forEach((p,i)=>{let x=xFor(p.week),y=yFor(p.high);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    for(let i=target.length-1;i>=0;i--){let p=target[i];ctx.lineTo(xFor(p.week),yFor(p.low))}
    ctx.closePath();ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=.55;ctx.strokeStyle=accent;ctx.lineWidth=1.5;
    ['low','high'].forEach(k=>{ctx.beginPath();target.forEach((p,i)=>{let x=xFor(p.week),y=yFor(p[k]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});
    ctx.restore();
  }

  // Daily weigh-ins
  ctx.fillStyle='#98a2b3';
  daily.forEach(p=>{ctx.beginPath();ctx.arc(xFor(p.date),yFor(+p.kg),3.2,0,Math.PI*2);ctx.fill()});

  // Weekly average line
  if(weeks.length){
    ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.beginPath();
    weeks.forEach((p,i)=>{let x=xFor(p.week),y=yFor(+p.average);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
    weeks.forEach(p=>{ctx.fillStyle=accent;ctx.beginPath();ctx.arc(xFor(p.week),yFor(+p.average),4.5,0,Math.PI*2);ctx.fill()});
  }

  // X-axis labels
  let first=allDates.sort()[0],last=allDates.sort().at(-1);
  ctx.fillStyle=muted;ctx.fillText(first,pad.l,H-14);
  let tw=ctx.measureText(last).width;ctx.fillText(last,W-pad.r-tw,H-14);
}

function parseRange(r){let m=String(r).replace("–","-").match(/(\d+)\s*-\s*(\d+)/);return m?[+m[1],+m[2]]:[+r,+r]}
function normalizeSession(k){return String(k||'').replace(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*[—-]\s*/,'')}
function currentSessionKey(){let k=Object.keys(plan()).find(x=>x.startsWith(day));return normalizeSession(k||day)}
function sessionKeyForLog(l){if(l.session)return normalizeSession(l.session);let p=P[l.week]||{};return normalizeSession(Object.keys(p).find(k=>k.startsWith(l.day))||l.day)}
function progLast(ex){let key=currentSessionKey();return logs.slice().reverse().find(x=>x.exercise===ex&&sessionKeyForLog(x)===key)}
function progressionModel(ex,sets,range){
 let [min,max]=parseRange(range),last=progLast(ex),inc=PROG_CONFIG[ex]??2.5;
 if(!last)return{weight:null,targetReps:Array(sets).fill(min),action:'start',message:`Start around ${min} reps with 1–2 reps in reserve. Use a load you can control cleanly.`};
 let prev=last.sets||[],prevReps=Array.from({length:sets},(_,i)=>+(prev[i]?.reps||prev[prev.length-1]?.reps||0)),prevWeights=Array.from({length:sets},(_,i)=>+(prev[i]?.kg||prev[prev.length-1]?.kg||0));
 let valid=prevReps.filter(Boolean),avg=valid.length?valid.reduce((a,b)=>a+b,0)/valid.length:0;
 let sameWeight=prevWeights.filter(Boolean).length?Math.max(...prevWeights.filter(Boolean)):0;
 let allTop=prevReps.length>=sets&&prevReps.slice(0,sets).every(r=>r>=max);
 let anyBelow=prevReps.slice(0,sets).some(r=>r>0&&r<min);
 let mostlyBelow=valid.length>0&&valid.filter(r=>r<min).length/valid.length>=0.5;
 if(allTop&&inc>0){
   let weight=Math.round((sameWeight+inc)/inc)*inc;
   return{weight,targetReps:Array(sets).fill(min),action:'increase',message:`Last session hit ${max} reps on every set. Add ${inc} kg and aim for ${min} reps on each set.`};
 }
 if(mostlyBelow&&inc>0){
   let weight=Math.max(0,Math.round((sameWeight-inc)/inc)*inc);
   return{weight,targetReps:Array(sets).fill(min),action:'reduce',message:`Last session fell below the minimum on most sets. Reduce the load by ${inc} kg and rebuild from ${min} reps.`};
 }
 let targets=prevReps.map((r,i)=>r?Math.min(max,r+1):min);
 while(targets.length<sets)targets.push(min);
 let label=anyBelow?'Hold / rebuild':'Hold weight';
 let msg=anyBelow?`Keep the load and bring the lower-rep sets back to at least ${min}. Add a rep where possible.`:`Keep the load and try to add 1 rep to each set that is below ${max}.`;
 return{weight:sameWeight||null,targetReps:targets,action:'hold',message:msg,average:avg};
}
function progressionCard(ex,sets,range){
 let r=progressionModel(ex,sets,range),last=progLast(ex),prev=last?last.sets.map(s=>`${s.kg}kg × ${s.reps}`).join(' / '):'None yet';
 let label=r.action==='increase'?'Increase weight':r.action==='reduce'?'Reduce weight':r.action==='hold'?'Progress reps':'Starting point';
 let targets=r.targetReps.join(' / ');
 return `<div class="prog-card"><div class="prog-title">🎯 Smarter progression</div><div class="prog-main">${r.weight!==null?`<b>${r.weight} kg</b> · `:''}<b>Target reps: ${targets}</b></div><div class="prog-prev">Previous same session: ${esc(prev)}</div><div class="prog-action ${r.action}"><b>${label}</b> — ${esc(r.message)}</div>
            <div class="ref-note"><b>Progression rule:</b> ${r.action==='increase'?'You hit the top of the prescribed rep range across all working sets, so the next step is a small load increase.':r.action==='reduce'?'Performance fell below the minimum rep target, so the app is prioritising quality reps and recovery over forcing load progression.':r.action==='hold'?'You are still progressing within the rep range, so the best next step is to keep the load and add reps before increasing weight.':'This exercise does not yet have enough history for a personalised progression recommendation.'}</div></div>`;
}


function getAllExerciseLogs(ex){return logs.filter(x=>x.exercise===ex&&Array.isArray(x.sets))}
function estimated1RM(w,r){w=+w||0;r=+r||0;return w&&r?(r===1?w:w*(1+r/30)):0}
function getPRData(ex){
 let heaviest={kg:0,reps:0},repPR={reps:0,kg:0},e1={value:0},vol={value:0};
 getAllExerciseLogs(ex).forEach(w=>{let total=0;(w.sets||[]).forEach(s=>{
  let kg=+s.kg||0,r=+s.reps||0;total+=kg*r;
  if(kg>heaviest.kg||(kg===heaviest.kg&&r>heaviest.reps))heaviest={kg,reps:r};
  if(r>repPR.reps||(r===repPR.reps&&kg>repPR.kg))repPR={reps:r,kg};
  let e=estimated1RM(kg,r);if(e>e1.value)e1={value:e};
 });if(total>vol.value)vol={value:total}});return{heaviest,repPR,e1,vol}
}
function prCard(ex){let p=getPRData(ex);if(!p.heaviest.kg&&!p.repPR.reps)return "";let f=n=>Math.round(n*10)/10;return `<div class="pr-card"><div class="pr-title">🏆 Personal records</div><div class="pr-grid"><div><span>Heaviest</span><b>${p.heaviest.kg} kg × ${p.heaviest.reps}</b></div><div><span>Rep PR</span><b>${p.repPR.reps} reps @ ${p.repPR.kg} kg</b></div><div><span>Est. 1RM</span><b>${f(p.e1.value)} kg</b></div><div><span>Best volume</span><b>${f(p.vol.value)} kg</b></div></div></div>`}
function allPRRows(){return [...new Set(logs.map(x=>x.exercise).filter(Boolean))].map(ex=>({ex,pr:getPRData(ex)})).filter(x=>x.pr.heaviest.kg||x.pr.repPR.reps)}
function prs(){let rows=allPRRows();return `<section class="card"><h2>🏆 Personal Records</h2><p class="sub">Your best performances across every exercise you've logged.</p>${rows.length?rows.map(x=>`<div class="pr-row"><div class="pr-ex">${esc(x.ex)}</div><div class="pr-metrics"><span><b>${x.pr.heaviest.kg} kg</b> max load</span><span><b>${x.pr.repPR.reps}</b> rep PR</span><span><b>${Math.round(x.pr.e1.value*10)/10} kg</b> est. 1RM</span><span><b>${Math.round(x.pr.vol.value)} kg</b> best volume</span></div></div>`).join(""):`<div class="empty">Complete a workout to start building your PR board.</div>`}</section>`}

function render(){try{let c=page==='workout'?renderWorkout():page==='history'?history():page==='progress'?progress():page==='coach'?coach():settings();document.getElementById('app').innerHTML=c;if(page==='progress')draw()}catch(e){document.getElementById('app').innerHTML='<section class="card"><h2>Something went wrong</h2><p>Your saved workouts have not been deleted.</p><code>'+esc(e.message)+'</code><br><button onclick="location.reload()">Reload app</button></section>'}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});applyTheme();render();</script></body></html>
